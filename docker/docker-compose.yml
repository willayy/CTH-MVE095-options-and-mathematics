services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: always
    env_file:
      - ../.env
    environment:
      EXISTING_SESSION_DETECTED_ACTION: "primary"
      READ_ONLY_API: "no"
      RESTART_TIME: "23:55"
      VNC_SERVER: "yes"
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD:-trading123}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "127.0.0.1:4002:4004"
      - "127.0.0.1:4001:4003"
      - "127.0.0.1:5900:5900"

  trading-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: always
    depends_on:
      - ib-gateway
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ../data:/app/data
    command: [
      "python", "src/main.py",
      "--host", "ib-gateway",
      "--port", "4004",
      "--client-id", "${INTERACTIVE_BROKERS_CLIENT_ID:-10}",
      "--fixed-capital-amount", "${FIXED_CAPITAL_AMOUNT_DOLLARS:-100000.0}",
      "--credibility-percentage", "${CREDIBILITY_INTERVAL_PERCENTAGE:-0.95}",
      "--decay-factor", "${DECAY_FACTOR:-0.995}",
      "--check-interval-seconds", "${CHECK_INTERVAL_SECONDS:-30.0}",
      "SPX:CBOE:USD", "ESTX50:EUREX:EUR"
    ]
