services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: always
    env_file:
      - .env
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: "no"
      RESTART_TIME: "23:55"
    ports:
      - "127.0.0.1:4002:4002"
      - "127.0.0.1:4001:4001"

  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - ib-gateway
    env_file:
      - .env
    environment:
      INTERACTIVE_BROKERS_HOST: ib-gateway
      INTERACTIVE_BROKERS_PORT: ${INTERACTIVE_BROKERS_PORT:-4002}
      INTERACTIVE_BROKERS_CLIENT_ID: ${INTERACTIVE_BROKERS_CLIENT_ID:-10}
      CREDIBILITY_INTERVAL_PERCENTAGE: ${CREDIBILITY_INTERVAL_PERCENTAGE:-0.95}
      CAPITAL_INVESTMENT_PERCENTAGE: ${CAPITAL_INVESTMENT_PERCENTAGE:-0.05}
      TZ: UTC
    command: ["python", "src/trading_bot.py"]
