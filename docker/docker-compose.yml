services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: always
    env_file:
      - .env
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: "no"
      RESTART_TIME: "23:55"
    ports:
      - "127.0.0.1:4002:4002"
      - "127.0.0.1:4001:4001"

  trading-bot-spx:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - ib-gateway
    env_file:
      - .env
    environment:
      INTERACTIVE_BROKERS_HOST: ib-gateway
      INTERACTIVE_BROKERS_PORT: ${INTERACTIVE_BROKERS_PORT:-4002}
      INTERACTIVE_BROKERS_CLIENT_ID: ${INTERACTIVE_BROKERS_CLIENT_ID_SPX:-10}
      CREDIBILITY_INTERVAL_PERCENTAGE: ${CREDIBILITY_INTERVAL_PERCENTAGE:-0.95}
      FIXED_CAPITAL_AMOUNT_DOLLARS: ${FIXED_CAPITAL_AMOUNT_DOLLARS:-10000.0}
      DECAY_FACTOR: ${DECAY_FACTOR:-0.995}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-5.0}
      TARGET_SYMBOL: SPX
      TARGET_EXCHANGE: CBOE
      TARGET_CURRENCY: USD
      TZ: UTC
    command: [
      "python", "src/trading_bot.py",
      "--host", "ib-gateway",
      "--port", "${INTERACTIVE_BROKERS_PORT:-4002}",
      "--client-id", "${INTERACTIVE_BROKERS_CLIENT_ID_SPX:-10}",
      "--fixed-capital-amount", "${FIXED_CAPITAL_AMOUNT_DOLLARS:-10000.0}",
      "--credibility-percentage", "${CREDIBILITY_INTERVAL_PERCENTAGE:-0.95}",
      "--decay-factor", "${DECAY_FACTOR:-0.995}",
      "--check-interval-seconds", "${CHECK_INTERVAL_SECONDS:-5.0}",
      "SPX", "CBOE", "USD"
    ]

  trading-bot-dj600:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - ib-gateway
    env_file:
      - .env
    environment:
      INTERACTIVE_BROKERS_HOST: ib-gateway
      INTERACTIVE_BROKERS_PORT: ${INTERACTIVE_BROKERS_PORT:-4002}
      INTERACTIVE_BROKERS_CLIENT_ID: ${INTERACTIVE_BROKERS_CLIENT_ID_DJ600:-11}
      CREDIBILITY_INTERVAL_PERCENTAGE: ${CREDIBILITY_INTERVAL_PERCENTAGE:-0.95}
      FIXED_CAPITAL_AMOUNT_DOLLARS: ${FIXED_CAPITAL_AMOUNT_DOLLARS:-10000.0}
      DECAY_FACTOR: ${DECAY_FACTOR:-0.995}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-5.0}
      TARGET_SYMBOL: DJ600
      TARGET_EXCHANGE: EUREX
      TARGET_CURRENCY: EUR
      TZ: UTC
    command: [
      "python", "src/trading_bot.py",
      "--host", "ib-gateway",
      "--port", "${INTERACTIVE_BROKERS_PORT:-4002}",
      "--client-id", "${INTERACTIVE_BROKERS_CLIENT_ID_DJ600:-11}",
      "--fixed-capital-amount", "${FIXED_CAPITAL_AMOUNT_DOLLARS:-10000.0}",
      "--credibility-percentage", "${CREDIBILITY_INTERVAL_PERCENTAGE:-0.95}",
      "--decay-factor", "${DECAY_FACTOR:-0.995}",
      "--check-interval-seconds", "${CHECK_INTERVAL_SECONDS:-5.0}",
      "DJ600", "EUREX", "EUR"
    ]
